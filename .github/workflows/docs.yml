name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "docs/screenshots/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs
        working-directory: docs/site
        run: python build.py
      - name: Assemble site (landing page at /, docs at /docs/)
        run: |
          mkdir -p _site/docs _site/img
          cp -R docs/site/dist/. _site/docs/
          cp -R docs/site/landing/. _site/
          for f in hero-light hero-dark menu-dark pointer-light battery-dark buttons-dark; do
            cp "docs/screenshots/$f.png" _site/img/
          done
          touch _site/.nojekyll
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
