name: Screenshots

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label'
        default: 'macos-26'

jobs:
  shoot:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: swift --version
      - name: Build showcase
        run: swift build -c release --product OptuneShowcase
      - name: Bundle
        run: bash Scripts/bundle-showcase.sh release
      - name: Prepare
        run: mkdir -p shots
      - name: Capture scenes
        run: |
          BIN=".build/OptuneShowcase.app/Contents/MacOS/OptuneShowcase"
          shoot() {  # scene mode flag suffix
            OUT="$PWD/shots/$1-$2$4.png"
            "$BIN" --scene "$1" --$2 --out "$OUT" $3 > "shots/$1-$2$4.log" 2>&1 &
            PID=$!
            for i in $(seq 1 15); do kill -0 $PID 2>/dev/null || break; sleep 1; done
            kill -9 $PID 2>/dev/null || true
            ls -la "$OUT" 2>&1 || echo "missing $OUT"; head -5 "shots/$1-$2$4.log"
          }
          for mode in dark light; do
            for scene in hero menu pointer battery buttons shapes; do shoot $scene $mode "--render" ""; done
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots
          path: shots/*
