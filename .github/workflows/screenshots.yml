name: Screenshots

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label'
        default: 'macos-26'

jobs:
  shoot:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Toolchain
        run: swift --version
      - name: Build showcase
        run: swift build -c release --product OptuneShowcase
      - name: Bundle
        run: bash Scripts/bundle-showcase.sh release
      - name: Capture scenes
        run: |
          mkdir -p shots
          BIN=".build/OptuneShowcase.app/Contents/MacOS/OptuneShowcase"
          shoot() {  # scene mode
            OUT="$PWD/shots/$1-$2.png"
            "$BIN" --scene "$1" --$2 --out "$OUT" > "shots/$1-$2.log" 2>&1 &
            PID=$!
            for i in $(seq 1 40); do kill -0 $PID 2>/dev/null || break; sleep 1; done
            kill -9 $PID 2>/dev/null || true
            ls -la "$OUT" 2>&1 || echo "missing $OUT"; cat "shots/$1-$2.log" | head -5
          }
          shoot hero dark
          for mode in dark light; do
            for scene in hero menu pointer battery buttons; do shoot $scene $mode; done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/*
