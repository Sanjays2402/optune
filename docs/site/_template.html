<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#07080a">
  <meta name="color-scheme" content="light dark">
  <link rel="canonical" href="https://optune.app/{{PATH}}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Optune">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
  <meta property="og:url" content="https://optune.app/{{PATH}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{TITLE}}">
  <meta name="twitter:description" content="{{DESCRIPTION}}">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <script>try{const t=localStorage.getItem('optune-theme');document.documentElement.dataset.theme=t==='light'||t==='dark'?t:(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark')}catch{document.documentElement.dataset.theme='dark'}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..800&family=Inter:wght@300..800&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ASSETS}}/style.css">
</head>
<body class="{{BODY_CLASS}}">
  <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="shell">
    <aside class="sidebar">
      <div class="sidebar-head">
        <a class="brand" href="{{ROOT}}index.html">
          <span class="mark"></span>
          <span>
            <strong>Optune</strong>
            <small>Logitech control for macOS</small>
          </span>
        </a>
        <button class="theme-toggle" data-theme-toggle aria-label="Switch color theme">
          <span class="theme-toggle__icon" aria-hidden="true"></span>
          <span class="theme-toggle__label">Dark</span>
        </button>
      </div>

      <label class="search">
        <span>Search</span>
        <input type="search" placeholder="Filter sections…" aria-label="Filter sections">
      </label>

      <nav>{{SIDEBAR}}</nav>
    </aside>

    <main>
      <header class="hero">
        <div class="hero-text">
          <p class="eyebrow">{{SECTION}}</p>
          <h1>{{HERO_TITLE}}</h1>
          {{LEDE}}
        </div>
        <div class="hero-meta">
          <a class="repo" href="https://github.com/Sanjays2402/optune" target="_blank" rel="noopener">GitHub</a>
          <a class="edit" href="https://github.com/Sanjays2402/optune/blob/main/docs/site/pages/{{SLUG}}.md" target="_blank" rel="noopener">Edit page</a>
        </div>
      </header>

      <div class="doc-grid">
        <article class="doc">
{{CONTENT}}
{{PAGE_NAV}}
        </article>
        {{TOC}}
      </div>
    </main>
  </div>
  <script src="{{ASSETS}}/site.js" defer></script>
</body>
</html>
